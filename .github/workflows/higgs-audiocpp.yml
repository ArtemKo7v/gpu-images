name: higgs-audiocpp

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - higgs-audiocpp/**
      - .github/workflows/higgs-audiocpp.yml

permissions:
  contents: read
  packages: write

concurrency:
  group: higgs-audiocpp
  cancel-in-progress: true

defaults:
  run:
    working-directory: higgs-audiocpp

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Free runner disk for runtime and model layers
        working-directory: /
        run: |
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune --all --force
          df -h /
          available=$(df --output=avail -B1 / | tail -1)
          test "$available" -ge 21474836480 || { echo 'Need at least 20 GiB free for runtime and model'; exit 1; }
      - uses: actions/checkout@v6
      - name: Check start script
        run: python3 -m py_compile start.py
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}/higgs-audiocpp" >> "$GITHUB_OUTPUT"
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: higgs-audiocpp
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:cuda12-${{ github.sha }}
            ${{ steps.name.outputs.image }}:cuda12
          provenance: true
      - name: Record digest
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s\n' "${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
